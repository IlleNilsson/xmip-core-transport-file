[package]
name = "xmip-core-transport-file"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-file"
description = "File transport: Streams that arrive as files in a directory, told by the file system. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The Transport trait, Arrived, Directions, the error
# vocabulary and the line-oriented wire helpers live there. Standard library
# otherwise, which is what lets this build on every target in
# deployment-model.md without a cross-compilation story.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main", optional = true }
# The names what this technology observed of a sender travels under, which
# the identity gates read (`context::property`, ADR-0019 amendment
# 2026-10-06).
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main", optional = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# A filesystem path as the path of a URI, written once for the estate.
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main", optional = true }
# Percent-encoding, written and read once for the estate.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main", optional = true }
# The directory synced after a send's rename, written once for the estate.
file = { package = "xmip-core-library-file", git = "https://github.com/IlleNilsson/xmip-core-library-file", branch = "main", optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:transport", "dep:context", "dep:net", "dep:codec", "dep:file"]
# The declaration alone.
declaration = []

[dev-dependencies]
# A test's own temporary folder (`file::temporary`); for the tests only.
file = { package = "xmip-core-library-file", git = "https://github.com/IlleNilsson/xmip-core-library-file", branch = "main", features = ["test-support"] }
# A node started again, as a test builds it (`transport::NodeStart::next`),
# from the capability's test support and never a production build.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main", features = ["test-support"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
